<title>We Go Where?</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1d1b20;--mu:#6b6670;--ac:#d6336c;--ac2:#fde4ee;--bd:#e6e0d8;--ok:#1a7f4b;--okbg:#dff5e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--card:#201d27;--tx:#f1eef5;--mu:#a29cae;--ac:#ff6b9d;--ac2:#3a2230;--bd:#34303d;--ok:#6fe0a0;--okbg:#17372a}}
:root[data-theme="dark"]{--bg:#15131a;--card:#201d27;--tx:#f1eef5;--mu:#a29cae;--ac:#ff6b9d;--ac2:#3a2230;--bd:#34303d;--ok:#6fe0a0;--okbg:#17372a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.q h2{font-size:1rem;margin:0 0 2px}
.q small{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 14px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer}
.go{background:var(--ac);color:#fff}
.rs{background:var(--card);color:var(--tx);border:1px solid var(--bd);flex:0 0 auto;padding:13px 18px}
#res{margin-top:24px}
.r{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.r.top{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-size:1.15rem;font-weight:700}
.pc{background:var(--ac2);color:var(--ac);font-weight:700;border-radius:999px;padding:2px 12px;font-size:.9rem}
.meta{color:var(--mu);font-size:.88rem;margin:4px 0 8px}
.tg{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:999px;margin:2px 4px 2px 0;background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.tg.m{background:var(--okbg);color:var(--ok);border-color:transparent}
.promo{margin-top:6px;font-size:.88rem}
.empty{text-align:center;color:var(--mu);padding:30px 0}
</style>
</head>
<body>
<main>
<h1>We Go Where ?</h1>
<p class="sub">เลือกตัวเลือกที่ชอบ (ข้ามข้อไหนก็ได้) แล้วกดดูร้านที่ตรงใจที่สุด</p>
<div id="qs"></div>
<div class="bar"><button class="btn rs" id="rs">ล้างค่า</button><button class="btn go" id="go">ดูร้านที่เหมาะ</button></div>
<div id="res"></div>
</main>

];
var Q=[
{k:"loc",t:"1. อยากไปแถวไหน?",o:["ในเมือง","แถวมอ"],single:1},
{k:"type",t:"2. ประเภทร้าน",o:["นั่งชิล","ปาร์ตี้/Club","Restaurant","Bar","Pub","Live Music","Cocktail Bar"]},
{k:"music",t:"3. เพลง",o:["Live Band","DJ","EDM"]},
{k:"en",t:"4. ความคึกคัก",o:["Chill","Moderate","Lively","Party"],h:"Chill = นั่งชิล, Party = เต้น"},
{k:"vibe",t:"5. บรรยากาศ",o:["Indoor","Outdoor","มืด","หรู","Casual","Romantic","Social","Private"]},
{k:"who",t:"6. ไปกับใคร / โอกาส",o:["เดต","คู่รัก","เพื่อน 2–4 คน","กลุ่มใหญ่","วันเกิด","สังสรรค์","คนไปคนเดียว","สายชิล","สายปาร์ตี้"]},
{k:"drink",t:"7. เครื่องดื่ม",o:["Beer","เหล้า","Cocktail","Whisky","Wine","Soju","Shots"]},
{k:"food",t:"8. อาหาร",o:["อาหารจริงจัง","กับแกล้ม"]},
{k:"seat",t:"9. ที่นั่ง",o:["โต๊ะเล็ก","โต๊ะใหญ่","Sofa","Bar counter","Outdoor","หน้าเวที"]}
];
var S={};
function draw(){
 var h="";
 Q.forEach(function(q){
  h+='<div class="q"><h2>'+q.t+'</h2><small>'+(q.single?'เลือกได้ 1 ข้อ':'เลือกได้หลายข้อ')+(q.h?' · '+q.h:'')+'</small><div class="chips">';
  q.o.forEach(function(o){var on=(S[q.k]||[]).indexOf(o)>-1;h+='<button class="chip'+(on?' on':'')+'" data-k="'+q.k+'" data-o="'+o+'">'+o+'</button>'});
  h+='</div></div>';
 });
 document.getElementById("qs").innerHTML=h;
}
document.getElementById("qs").addEventListener("click",function(e){
 var b=e.target.closest(".chip");if(!b)return;
 var k=b.dataset.k,o=b.dataset.o,q=Q.filter(function(x){return x.k==k})[0],a=S[k]||[],i=a.indexOf(o);
 if(i>-1)a.splice(i,1);else if(q.single)a=[o];else a.push(o);
 S[k]=a;draw();
});
document.getElementById("rs").onclick=function(){S={};draw();document.getElementById("res").innerHTML=""};
document.getElementById("go").onclick=function(){
 var list=V.filter(function(v){var l=S.loc||[];return !l.length||l[0]==v.loc});
 list=list.map(function(v){
  var tot=0,hit=0,m={};
  Q.forEach(function(q){if(q.k=="loc")return;(S[q.k]||[]).forEach(function(o){tot++;if(v[q.k].indexOf(o)>-1){hit++;m[o]=1}})});
  return {v:v,m:m,tot:tot,hit:hit,p:tot?Math.round(hit*100/tot):100};
 }).sort(function(a,b){return b.p-a.p});
 var h='<h2>ร้านที่เหมาะกับคุณ</h2>';
 if(!list.length)h+='<div class="empty">ไม่พบร้าน</div>';
 list.forEach(function(r,i){
  var v=r.v,top=i==0&&r.tot&&r.p>0;
  var tags=[].concat(v.type,v.music,v.en,v.vibe,v.drink);
  h+='<div class="r'+(top?' top':'')+'"><div class="hd"><span class="nm">'+(top?'⭐ ':'')+v.n+'</span>'+(r.tot?'<span class="pc">ตรง '+r.p+'%</span>':'')+'</div>';
  h+='<div class="meta">📍 '+v.loc+(r.tot?' · ตรง '+r.hit+' จาก '+r.tot+' ข้อ':'')+'</div>';
  [["type"],["music"],["en"],["vibe"],["who"],["drink"],["food"],["seat"]].forEach(function(x){
   v[x[0]].forEach(function(t){h+='<span class="tg'+(r.m[t]&&(S[x[0]]||[]).indexOf(t)>-1?' m':'')+'">'+t+'</span>'});
  });
  if(v.promo)h+='<div class="promo">🍺 '+v.promo+'</div>';
  h+='</div>';
 });
 var el=document.getElementById("res");el.innerHTML=h;el.scrollIntoView({behavior:"smooth"});
};
draw();
